name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: Client
      options: [Claude Code, Cursor, VS Code, Codex, CLI only, Python API, Other]
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `mindtrail doctor`
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Run with `MINDTRAIL_LOG_LEVEL=DEBUG`. Remove anything private first.
      render: text
