name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff format --check src tests
      - run: ruff check src tests
      - run: mypy src

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest
      - name: CLI smoke test
        env:
          MINDTRAIL_HOME: ${{ runner.temp }}/mindtrail
          MINDTRAIL_EMBEDDER: hashing
        run: |
          mindtrail doctor
          mindtrail remember "CI smoke test memory" --scope personal
          mindtrail recall "smoke test"

  semantic:
    name: retrieval benchmark (neural embeddings)
    runs-on: ubuntu-latest
    env:
      MINDTRAIL_HOME: ${{ runner.temp }}/mindtrail
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/mindtrail/models
          key: fastembed-bge-small-en-v1.5
      - run: pip install -e ".[dev,semantic]"
      - run: mindtrail init --client claude-code  # downloads the model into the cache
      - run: pytest tests/evaluation
      - run: mindtrail bench --embedder fastembed --json bench.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: bench-*.json

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
