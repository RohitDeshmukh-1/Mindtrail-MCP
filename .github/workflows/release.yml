# Publishes to PyPI when a version tag (v*) is pushed.
# One-time setup: add this repository as a Trusted Publisher on PyPI
# (https://docs.pypi.org/trusted-publishers/) with environment name "pypi".
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes

  # Lists the release in the official MCP Registry (registry.modelcontextprotocol.io).
  # The registry verifies the PyPI package via the `mcp-name:` marker in README.md.
  mcp-registry:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - name: Set version in server.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.tmp
          mv server.tmp server.json
      - run: ./mcp-publisher login github-oidc
      - name: Publish to MCP Registry
        # PyPI can take a minute to serve a new release; retry until the registry can see it.
        run: |
          for i in 1 2 3 4 5; do ./mcp-publisher publish && exit 0; sleep 30; done
          exit 1
